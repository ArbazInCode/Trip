<style>
:root{
  --navy:#13294B;--navy-2:#1E3A66;--gold:#C9973A;--gold-2:#E7C77E;--gold-ink:#7A5A16;--gold-bg:#FBF3E2;
  --bg:#F8F6F1;--panel:#FFFFFF;--ink:#14213D;--muted:#667085;--line:#ECE8DF;--line-2:#F2EFE8;--g1:#EEF2F8;
  --blue:#2457C5;--blue-bg:#EAF0FD;--red:#C2362B;--red-bg:#FDECEA;--ok:#18794E;--ok-bg:#E7F6EE;--amber-bg:#FEF4DC;--violet:#6941C6;--violet-bg:#F1ECFD;
  --shadow:0 1px 2px rgba(20,33,61,.04),0 6px 20px rgba(20,33,61,.06);--shadow-lg:0 2px 6px rgba(20,33,61,.06),0 18px 44px rgba(20,33,61,.10);

  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0F1522;--panel:#161E2E;--ink:#EEF1F6;--muted:#9AA4B5;--line:#253045;--line-2:#1D2638;--g1:#1F2A40;--gold-bg:#2D2414;--gold-ink:#E7C77E;--blue-bg:#18233D;--blue:#93B4F5;--red-bg:#3A1C1A;--ok-bg:#132C22;--ok:#6FD3A0;--amber-bg:#33290F;--violet-bg:#241B3D;--violet:#B9A6F0;--navy:#E7C77E;--shadow:0 1px 2px rgba(0,0,0,.3);--shadow-lg:0 10px 30px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0F1522;--panel:#161E2E;--ink:#EEF1F6;--muted:#9AA4B5;--line:#253045;--line-2:#1D2638;--g1:#1F2A40;--gold-bg:#2D2414;--gold-ink:#E7C77E;--blue-bg:#18233D;--blue:#93B4F5;--red-bg:#3A1C1A;--ok-bg:#132C22;--ok:#6FD3A0;--amber-bg:#33290F;--violet-bg:#241B3D;--violet:#B9A6F0;--navy:#E7C77E;--shadow:0 1px 2px rgba(0,0,0,.3);--shadow-lg:0 10px 30px rgba(0,0,0,.4)}
html,body{height:100%}html{scroll-padding-top:calc(130px + env(safe-area-inset-top,0px))}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(900px 420px at 85% -10%,rgba(201,151,58,.10),transparent 60%),radial-gradient(800px 380px at -10% 0%,rgba(36,87,197,.07),transparent 60%);z-index:-1}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.hidden{display:none!important}
/* Header */
.top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.82);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .top{background:rgba(22,30,46,.85)}}
:root[data-theme="dark"] .top{background:rgba(22,30,46,.85)}
.top-in{max-width:1320px;margin:0 auto;padding:12px 24px 0;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#13294B,#2C5282);display:grid;place-items:center;color:#E7C77E;font-family:var(--serif);font-weight:600;font-size:1.05rem;box-shadow:0 6px 16px rgba(19,41,75,.25);flex:none}
.brand{display:flex;flex-direction:column;line-height:1.15;margin-right:auto}
.brand b{font-family:var(--serif);font-weight:600;font-size:1.22rem;color:var(--ink);letter-spacing:-.01em}
.brand span{font-size:.78rem;color:var(--muted);margin-top:2px}
.live{display:flex;align-items:center;gap:8px;font-size:.8rem;font-weight:600;color:var(--muted);background:var(--panel);border:1px solid var(--line);padding:6px 12px;border-radius:999px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:#22A06B;animation:pulse 2s infinite}.dot.local{background:var(--gold);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,160,107,.5)}70%{box-shadow:0 0 0 7px rgba(34,160,107,0)}100%{box-shadow:0 0 0 0 rgba(34,160,107,0)}}
.tabs-in{max-width:1320px;margin:0 auto;padding:10px 24px 12px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}.tabs-in::-webkit-scrollbar{display:none}
.tab{all:unset;cursor:pointer;color:var(--muted);padding:8px 14px;font-weight:600;font-size:.9rem;white-space:nowrap;border-radius:999px;display:flex;gap:8px;align-items:center;transition:background .15s,color .15s}

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tab[aria-selected="true"]{color:#14213D}}
:root[data-theme="dark"] .tab[aria-selected="true"]{color:#14213D}
.tab:focus-visible{outline:2px solid var(--gold)}
.tab small{font-size:.72rem;font-weight:700;background:var(--gold-bg);color:var(--gold-ink);border-radius:999px;padding:1px 7px}
.tab[aria-selected="true"] small{background:rgba(255,255,255,.18);color:#fff}
main{max-width:1320px;margin:0 auto;padding:28px 24px 64px}
h1{font-family:var(--serif);font-weight:600;font-size:2rem;line-height:1.1;margin:0;letter-spacing:-.02em}
h2{font-family:var(--serif);font-weight:600;font-size:1.28rem;margin:0 0 12px;letter-spacing:-.01em}h3{font-size:1rem;margin:0 0 8px}

.vhead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}.vhead .sub{margin-bottom:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--shadow)}
.grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:20px;align-items:start}
@media (max-width:980px){.grid2{grid-template-columns:1fr!important}}
.btn{text-decoration:none;border:1px solid transparent;border-radius:12px;padding:10px 18px;font-weight:700;font-size:.9rem;cursor:pointer;background:var(--navy);color:#fff;display:inline-flex;align-items:center;gap:8px;justify-content:center;white-space:nowrap;transition:transform .15s,box-shadow .15s,background .15s;box-shadow:0 4px 12px rgba(19,41,75,.18)}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 18px rgba(19,41,75,.22)}.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.gold{background:linear-gradient(135deg,#D9A846,#C08A2E);color:#fff;box-shadow:0 4px 14px rgba(192,138,46,.32)}
.btn.ghost{background:var(--panel);color:var(--ink);border-color:var(--line);box-shadow:none}.btn.ghost:hover{background:var(--line-2)}
.btn.sm{padding:6px 12px;font-size:.82rem;border-radius:10px}.btn.danger{background:var(--panel);color:var(--red);border-color:var(--line);box-shadow:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn:not(.ghost):not(.gold):not(.danger){color:#14213D}}
:root[data-theme="dark"] .btn:not(.ghost):not(.gold):not(.danger){color:#14213D}
label{display:block;font-weight:600;font-size:.84rem;margin-bottom:6px;color:var(--ink)}
input[type=text],input[type=email],input[type=tel],input[type=search],input[type=date],input[type=number],select,textarea{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);transition:border-color .15s,box-shadow .15s}
textarea{resize:vertical;min-height:90px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 4px rgba(201,151,58,.16)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.fgrid .full{grid-column:1/-1}
@media (max-width:620px){.fgrid{grid-template-columns:1fr!important}}
.hint{font-size:.8rem;color:var(--muted);margin-top:4px}.err{color:var(--red);font-weight:600;font-size:.88rem;margin:10px 0 0}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap}
.p-reg{background:var(--blue-bg);color:var(--blue)}.p-wait{background:var(--amber-bg);color:var(--gold-ink)}.p-in{background:var(--ok-bg);color:var(--ok)}
.p-cancel{background:var(--line-2);color:var(--muted)}.p-no{background:var(--red-bg);color:var(--red)}.p-walk{background:var(--gold-bg);color:var(--gold-ink)}
.p-invite{background:var(--ok);color:#fff}.p-develop{background:var(--violet-bg);color:var(--violet)}.p-not_yet{background:var(--line-2);color:var(--muted)}
.t-open_house{background:var(--blue-bg);color:var(--blue)}.t-tryout{background:var(--violet-bg);color:var(--violet)}.t-camp{background:var(--ok-bg);color:var(--ok)}.t-info_session{background:var(--gold-bg);color:var(--gold-ink)}.t-showcase{background:var(--red-bg);color:var(--red)}
.muted{color:var(--muted)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.spacer{flex:1}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px;margin-bottom:20px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(var(--gold),#E7C77E)}
.kpi .v{font-family:var(--serif);font-weight:600;font-size:2rem;line-height:1;letter-spacing:-.02em}.kpi .l{font-size:.8rem;color:var(--muted);margin-top:8px;font-weight:600}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}@media (max-width:520px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem}

td{padding:12px;border-bottom:1px solid var(--line-2);vertical-align:middle}tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}tbody tr:hover{background:var(--line-2)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--line-2);border-radius:999px;overflow:hidden;margin-top:6px;min-width:90px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#C08A2E,#E7C77E);border-radius:999px}.bar i.full{background:linear-gradient(90deg,#C2362B,#E7756C)}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
.person{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line-2)}.person:last-child{border-bottom:0}
.avatar{width:40px;height:40px;border-radius:12px;background:var(--g1);color:var(--navy-2);display:grid;place-items:center;font-weight:800;font-size:.85rem;flex:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .avatar{color:var(--gold-2)}}:root[data-theme="dark"] .avatar{color:var(--gold-2)}
.person .who{flex:1;min-width:0}.person .who b{display:block}.person .who small{color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}@media (max-width:620px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}.stat .v{font-family:var(--serif);font-weight:600;font-size:1.8rem;line-height:1}.stat .l{font-size:.8rem;color:var(--muted);font-weight:600;margin-top:6px}
/* public hero */
.hero{display:grid;grid-template-columns:1.1fr 1fr;background:var(--panel);border:1px solid var(--line);border-radius:22px;overflow:hidden;margin-bottom:24px;box-shadow:var(--shadow-lg)}
.hero .copy{padding:40px 40px 36px;display:flex;flex-direction:column;justify-content:center}
.hero .eb{font-size:.74rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-ink);font-weight:800}
.hero h1{font-size:clamp(2.1rem,3.6vw,3rem);margin:10px 0 12px;line-height:1.05}.hero h1 em{font-style:italic;color:var(--gold)}
.hero p{color:var(--muted);margin:0;max-width:34em;font-size:1.02rem}
.hero .ph{min-height:300px;background:#ddd center 30%/cover no-repeat;position:relative}
.hero .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--panel) 0%,rgba(255,255,255,0) 22%)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .hero .ph::after{background:linear-gradient(90deg,var(--panel) 0%,rgba(22,30,46,0) 22%)}}
.hero .facts{display:flex;gap:22px;margin-top:22px;flex-wrap:wrap}.hero .facts div{font-size:.82rem;color:var(--muted)}.hero .facts b{display:block;font-family:var(--serif);font-size:1.5rem;color:var(--ink)}
@media (max-width:820px){.hero{grid-template-columns:1fr}.hero .ph{min-height:220px;order:-1}.hero .ph::after{background:linear-gradient(0deg,var(--panel),rgba(255,255,255,0) 30%)}.hero .copy{padding:26px}}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:999px;padding:7px 15px;font-size:.85rem;font-weight:600;background:var(--panel);transition:all .15s}
.chip:hover{border-color:var(--gold)}.chip[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}.chip:focus-visible{outline:2px solid var(--gold)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#14213D}}:root[data-theme="dark"] .chip[aria-pressed="true"]{color:#14213D}
.evcard{display:grid;grid-template-columns:84px 1fr auto;gap:18px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:12px;box-shadow:var(--shadow);transition:transform .18s,box-shadow .18s,border-color .18s}
.evcard:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.evcard[aria-current="true"]{border-color:var(--gold);box-shadow:0 0 0 4px rgba(201,151,58,.14),var(--shadow-lg)}
.date{text-align:center;background:linear-gradient(160deg,var(--gold-bg),var(--panel));border:1px solid var(--line);border-radius:14px;padding:10px 6px}
.date b{display:block;font-family:var(--serif);font-weight:600;font-size:2rem;line-height:1;color:var(--ink)}.date span{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-ink);font-weight:800}
.evcard h3{font-size:1.08rem;margin:6px 0 2px}.evcard .meta{font-size:.85rem;color:var(--muted)}
@media (max-width:640px){.evcard{grid-template-columns:68px 1fr}.evcard .act{grid-column:1/-1}}
.kidbox{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;background:var(--bg)}
.confirm{text-align:center;padding:22px 10px}.code{font-family:var(--serif);font-weight:600;font-size:2.8rem;letter-spacing:.08em;color:var(--navy);line-height:1;margin:10px 0}
.bigsearch{font-size:1.1rem!important;padding:14px 16px!important}
.scale{display:flex;gap:6px;flex-wrap:wrap}.scale input{position:absolute;opacity:0;pointer-events:none}
.scale label{margin:0;border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-weight:600;font-size:.82rem;cursor:pointer;background:var(--panel);transition:all .15s}
.scale label:hover{border-color:var(--gold)}.scale input:checked+label{background:var(--navy);border-color:var(--navy);color:#fff}.scale input:focus-visible+label{outline:2px solid var(--gold)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .scale input:checked+label{color:#14213D}}:root[data-theme="dark"] .scale input:checked+label{color:#14213D}
.alist{display:grid;gap:8px;max-height:580px;overflow:auto;padding:2px}
.aitem,.seg{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel);width:100%;transition:border-color .15s,box-shadow .15s}
.aitem:hover,.seg:hover{border-color:var(--gold-2)}
.aitem[aria-current="true"],.seg[aria-current="true"]{border-color:var(--gold);box-shadow:0 0 0 4px rgba(201,151,58,.14)}.aitem:focus-visible,.seg:focus-visible{outline:2px solid var(--gold)}
.seg{justify-content:space-between;margin-bottom:8px}.seg small{display:block;color:var(--muted);font-size:.8rem}
.alert{border:1px solid #F1DFB4;background:var(--gold-bg);padding:11px 14px;border-radius:12px;font-size:.9rem;margin-bottom:8px}
.alert.bad{border-color:#F4C7C2;background:var(--red-bg)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .alert{border-color:var(--line)}}
.funnel div{margin-bottom:12px}.funnel .row{font-size:.88rem}
.scrim{position:fixed;inset:0;background:rgba(20,33,61,.28);backdrop-filter:blur(3px);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(580px,100%);background:var(--bg);z-index:41;transform:translateX(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:-20px 0 50px rgba(20,33,61,.15);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.dh{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start;background:var(--panel)}

.tag{background:#fff;color:#14213D;width:min(420px,100%);border-radius:20px;overflow:hidden;box-shadow:0 30px 60px rgba(20,33,61,.25);border:1px solid #ECE8DF}
.tag .tb{background:linear-gradient(135deg,#FBF3E2,#fff);color:#7A5A16;padding:14px 20px;font-size:.74rem;letter-spacing:.18em;text-transform:uppercase;font-weight:800;border-bottom:1px solid #ECE8DF}
.tag .tn{padding:24px 20px 6px;font-family:var(--serif);font-weight:600;font-size:2.8rem;line-height:1.05;color:#13294B}
.tag .td{padding:0 20px 22px;color:#667085}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:#14213D;color:#fff;padding:12px 20px;border-radius:12px;font-size:.92rem;font-weight:600;opacity:0;pointer-events:none;transition:all .22s;z-index:60;max-width:calc(100% - 32px);box-shadow:var(--shadow-lg)}

.foot{max-width:1320px;margin:0 auto;padding:0 24px 32px;color:var(--muted);font-size:.8rem}
.spin{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;display:inline-block}@keyframes sp{to{transform:rotate(360deg)}}
.linkbtn{all:unset;cursor:pointer;color:var(--blue);font-weight:700;font-size:.82rem}.linkbtn:focus-visible{outline:2px solid var(--gold)}

/* ---- Hiring Event Manager specifics ---- */
.evsel{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:9px 12px;font-weight:600;max-width:100%;box-shadow:var(--shadow)}
.hero{display:block;padding:32px 34px;background:linear-gradient(135deg,var(--panel) 0%,var(--gold-bg) 100%);position:relative;margin-bottom:0}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border:2px solid rgba(201,151,58,.22);border-radius:50%}
.hero .eyebrow{font-size:.74rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-ink);font-weight:800}
.hero h1{font-size:2.4rem;margin:8px 0 10px;color:var(--ink)}.hero p{color:var(--muted);margin:0;max-width:40em}
.facts{display:flex;gap:28px;flex-wrap:wrap;margin-top:20px;font-size:.92rem}

.cell.booked{border:1px solid #C9D8F7;background:var(--blue-bg);color:var(--ink)}.cell.in_progress{border:1px solid #D9CCF8;background:var(--violet-bg);color:var(--ink)}.cell.done{border:1px solid #BFE6D0;background:var(--ok-bg);color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .cell.booked,:root:not([data-theme="light"]) .cell.in_progress,:root:not([data-theme="light"]) .cell.done{border-color:var(--line)}}

class LocalStore{
  constructor(){this.mode='local';this.key='hem-demo-v1';this.subs=[];
    let d=null;try{d=JSON.parse(localStorage.getItem(this.key))}catch(e){}
    this.d=d||this.fromSeed();
    try{this.bc=new BroadcastChannel('hem-demo');this.bc.onmessage=()=>{try{this.d=JSON.parse(localStorage.getItem(this.key))||this.d}catch(e){}this.emit()}}catch(e){this.bc=null}
    window.addEventListener('storage',e=>{if(e.key===this.key){try{this.d=JSON.parse(e.newValue)||this.d}catch(_){}this.emit()}});}
  fromSeed(){const d={};for(const k in LOCAL_SEED){d[k]={};for(const[id,v]of LOCAL_SEED[k])d[k][id]=JSON.parse(JSON.stringify(v))}return d}
  persist(){try{localStorage.setItem(this.key,JSON.stringify(this.d))}catch(e){}this.bc&&this.bc.postMessage('x');this.emit()}
  emit(){this.subs.forEach(s=>s.cb(this.list(s.col,s.ev)))}
  list(col,ev){return Object.entries(this.d[col]||{}).filter(([,v])=>!ev||v.eventId===ev).map(([id,v])=>({id,...v}))}
  async get(col,id){const v=(this.d[col]||{})[id];return v?{id,...JSON.parse(JSON.stringify(v))}:null}
  async set(col,id,data){(this.d[col]??={})[id]=JSON.parse(JSON.stringify(data));this.persist()}
  async update(col,id,patch){const cur=(this.d[col]||{})[id];if(!cur)throw{code:'invalid_argument',message:'missing'};const merge=(a,b)=>{for(const k in b){if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])&&a[k]&&typeof a[k]==='object')merge(a[k],b[k]);else a[k]=b[k]}};merge(cur,JSON.parse(JSON.stringify(patch)));this.persist()}
  async remove(col,id){if(this.d[col])delete this.d[col][id];this.persist()}
  sub(col,ev,cb){const s={col,ev,cb};this.subs.push(s);setTimeout(()=>cb(this.list(col,ev)));return()=>{this.subs=this.subs.filter(x=>x!==s)}}
  async claim(){return true}
  reset(){this.d=this.fromSeed();this.persist()}
}
class DbStore{
  constructor(db){this.mode='live';this.db=db}
  ref(col,id){return this.db.collection(col).doc(id)}
  async get(col,id){const s=await this.ref(col,id).get();return s.exists?{id:s.id,...s.data()}:null}
  async set(col,id,data){await this.ref(col,id).set(data)}
  async update(col,id,patch){await this.ref(col,id).update(patch)}
  async remove(col,id){await this.ref(col,id).delete()}
  sub(col,ev,cb){const q=ev?this.db.collection(col).where('eventId','==',ev):this.db.collection(col);
    return q.onSnapshot(s=>cb(s.docs.map(d=>({id:d.id,...d.data()}))),e=>{console.error(e);setLive('error')})}
  async claim(col,id){try{const r=await this.ref(col,id).acquire({holder:TAB,ttlMs:4000});return r.acquired}catch(e){return true}}
}

const A={
  async register({name,email,phone,roleId,experience,availability,walkin}){
    const em=email.trim().toLowerCase(),id=`${EV}--${slug(em)}`;
    if(S.candidates.some(c=>c.email===em))return{dup:true};
    if(!(await store.claim('candidates',id)))return{busy:true};
    if(await store.get('candidates',id))return{dup:true};
    const pre=event().codePrefix,ABC='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let code;
    do{code=pre+'-'+Array.from({length:4},()=>ABC[Math.floor(Math.random()*ABC.length)]).join('')}while(S.candidates.some(c=>c.code===code));
    const t=nowISO();
    const rec={eventId:EV,name:name.trim(),email:em,phone:phone.trim(),roleId,experience:experience.trim(),availability,code,
      status:walkin?'checked_in':'registered',source:walkin?'walk-in':'online',registeredAt:t,checkedInAt:walkin?t:null,
      slotId:null,interviewStartedAt:null,completedAt:null,decision:null,decidedAt:null,ai:null,createdLive:true};
    await store.set('candidates',id,rec);return{ok:true,id,rec};
  },
  async checkIn(id){const c=await store.get('candidates',id);if(!c)return{err:'Candidate not found.'};
    if(c.status!=='registered')return{already:true,at:c.checkedInAt,c};
    await store.update('candidates',id,{status:'checked_in',checkedInAt:nowISO()});return{ok:true,c}},
  async assign(slotId,cid){
    if(!(await store.claim('slots',slotId)))return{err:'Someone else is assigning this slot right now. Try again.'};
    const s=await store.get('slots',slotId);if(!s)return{err:'Slot not found.'};
    if(s.candidateId)return{err:`That slot was just taken by ${cand(s.candidateId)?.name||'another candidate'}.`};
    const c=await store.get('candidates',cid);if(!c)return{err:'Candidate not found.'};
    if(c.slotId)return{err:`${c.name} is already scheduled at ${slotFmt(S.slots.find(x=>x.id===c.slotId)?.time||'00:00')}.`};
    if(c.status!=='checked_in')return{err:`${c.name} must be checked in before being scheduled.`};
    const iv=ivOf(s.interviewerId);if(!(iv.roleIds||[]).includes(c.roleId))return{err:`${iv.name} doesn't interview for ${roleOf(c.roleId).title}.`};
    await store.update('slots',slotId,{candidateId:cid,status:'booked'});await store.update('candidates',cid,{slotId});return{ok:true,iv,s}},
  async unassign(slotId){const s=await store.get('slots',slotId);if(!s||!s.candidateId)return{err:'Slot is already open.'};
    if(s.status!=='booked')return{err:'This interview has already started.'};
    const cid=s.candidateId;await store.update('slots',slotId,{candidateId:null,status:'open'});
    if(await store.get('candidates',cid))await store.update('candidates',cid,{slotId:null});return{ok:true}},
  async autoAssign(){const queue=S.candidates.filter(c=>c.status==='checked_in'&&!c.slotId).sort((a,b)=>(a.checkedInAt||'').localeCompare(b.checkedInAt||''));
    let n=0,skipped=0;const taken=new Set();
    for(const c of queue){const open=S.slots.filter(s=>!s.candidateId&&!taken.has(s.id)&&ivOf(s.interviewerId).roleIds?.includes(c.roleId)).sort((a,b)=>a.time.localeCompare(b.time));
      if(!open.length){skipped++;continue}
      let done=false;for(const s of open.slice(0,3)){const r=await A.assign(s.id,c.id);if(r.ok){taken.add(s.id);n++;done=true;break}}
      if(!done)skipped++;}
    return{n,skipped}},
  async start(slotId){const s=await store.get('slots',slotId);if(!s||s.status!=='booked')return{err:'This interview can’t be started.'};
    await store.update('slots',slotId,{status:'in_progress'});await store.update('candidates',s.candidateId,{status:'interviewing',interviewStartedAt:nowISO()});return{ok:true}},
  async submitScore(slotId,ivId,data){const s=await store.get('slots',slotId);if(!s||s.status!=='in_progress')return{err:'Start the interview before submitting a scorecard.'};
    const cid=s.candidateId,t=nowISO();
    await store.set('scorecards',`${cid}--${ivId}`,{eventId:EV,candidateId:cid,interviewerId:ivId,...data,submittedAt:t});
    await store.update('slots',slotId,{status:'done'});await store.update('candidates',cid,{status:'completed',completedAt:t});return{ok:true}},
  async decide(cid,d){const c=await store.get('candidates',cid);if(!c)return{err:'Candidate not found.'};
    if(d!=='hold'&&c.status!=='completed')return{err:'Make Advance or Decline decisions after the interview scorecard is in.'};
    await store.update('candidates',cid,{decision:d,decidedAt:nowISO()});return{ok:true}},
  async clearTest(){const live=S.candidates.filter(c=>c.createdLive);
    for(const c of live){const s=slotOf(c);if(s)await store.update('slots',s.id,{candidateId:null,status:'open'});
      for(const sc of S.scorecards.filter(x=>x.candidateId===c.id))await store.remove('scorecards',sc.id);
      await store.remove('candidates',c.id)}return live.length}
};

async function aiBrief(cid,btn){
  if(!sample){toast('AI briefings run in the Claude-hosted version of this app.',true);return}
  const c=cand(cid);if(!c)return;const r=roleOf(c.roleId);
  btn&&(btn.disabled=true,btn.innerHTML='<span class="spin"></span> Preparing briefing…');
  const prompt=`You are helping an interview panel at a K-12 sports school prepare for a live interview.
Use ONLY the information below. Do NOT score, rank, or judge whether the candidate is suitable, and do NOT infer age, gender, ethnicity, disability, or any other personal characteristic. Humans make all hiring decisions.

ROLE: ${r.title}
ROLE SUMMARY: ${r.summary}
REQUIREMENTS:
${r.requirements.map(x=>'- '+x).join('\n')}

CANDIDATE APPLICATION:
Name: ${c.name}
Experience in their own words: ${c.experience}
Availability: ${c.availability||'Not given'}

Return ONLY JSON in this exact shape:
{"summary":"2-3 factual sentences about relevant experience","evidence":[{"requirement":"<each requirement, verbatim>","evidence":"what the application says, or 'Not mentioned'"}],"clarify":["2-3 specific things to ask about because the application doesn't say"],"questions":["exactly 3 job-related, open-ended interview questions"]}`;
  try{const out=await sample.json(prompt);
    if(!out||!out.summary)throw{code:'invalid_json'};
    const ai={summary:String(out.summary),evidence:(out.evidence||[]).slice(0,8).map(x=>({requirement:String(x.requirement||''),evidence:String(x.evidence||'')})),
      clarify:(out.clarify||[]).slice(0,4).map(String),questions:(out.questions||[]).slice(0,3).map(String),generatedAt:nowISO()};
    await store.update('candidates',cid,{ai});toast('AI briefing ready.');
  }catch(e){toast(e&&e.code==='not_granted'?'AI access was declined for this session.':e&&e.code==='rate_limited'?'AI is busy. Try again in a moment.':'Couldn’t prepare the briefing. Try again.',true)}
  finally{if(btn){btn.disabled=false;btn.textContent='Regenerate briefing'}}
}

async function draftEmail(id){const c=cand(id);if(!c)return;
  if(!sample){toast('AI email drafts run in the Claude-hosted version of this app.',true);return}
  if(!c.decision){toast('Make a decision first, then draft the email.',true);return}
  const b=$('#dmk'),box=$('#demail');b.disabled=true;b.innerHTML='<span class="spin"></span> Drafting…';box.value='';
  const e=event(),what={advance:'invite them to the next step: a short follow-up conversation with the campus director next week; ask them to reply with two or three times that work',hold:'thank them and explain the team is still finishing interviews and will be in touch within a week',decline:'thank them sincerely and let them know the team will not be moving forward for this role right now, and encourage them to apply for future openings'}[c.decision];
  try{await sample(`Write a short, warm, professional email from the ${e.org} Hiring Team to ${c.name}, who interviewed for the ${roleOf(c.roleId).title} role at our ${e.name} (${e.dateLabel}).
Purpose: ${what}.
Rules: under 140 words; plain text; first line must be "Subject: ..."; no salary or start-date promises; no mention of scores, AI, or other candidates; sign off as "${e.org} Hiring Team".`,
    {cache:false,onText:({text})=>{box.value=text}})}
  catch(x){toast(x&&x.code==='not_granted'?'AI access was declined for this session.':'Couldn’t draft the email. Try again.',true)}
  finally{b.disabled=false;b.textContent='Draft with AI'}}

/* ================= Setup: events, roles, interviewers, schedule ================= */
const openRoles=()=>(event()?.roles||[]).filter(r=>r.status!=='closed');
const rid=t=>slug(t).replace(/[@.+~]/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'').slice(0,40)+'-'+Math.random().toString(36).slice(2,6);
const toMin=t=>{const[h,m]=t.split(':').map(Number);return h*60+m};
const toHM=m=>`${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
function schedOf(e){if(e.schedule)return e.schedule;const ts=S.slots.map(s=>s.time).sort();
  return ts.length?{start:ts[0],end:toHM(toMin(ts[ts.length-1])+30),length:30}:{start:'09:00',end:'12:00',length:30}}
function slotTimes(sc){const out=[];for(let m=toMin(sc.start);m+Number(sc.length)<=toMin(sc.end);m+=Number(sc.length))out.push(toHM(m));return out}
const slotId=(ev,iv,t)=>`${ev}--${iv}--${t.replace(':','')}`;

Object.assign(A,{
  async saveEvent(fields){const cur=await store.get('events',EV);const{id,...rest}=cur;await store.set('events',EV,{...rest,...fields});return{ok:true}},
  async createEvent(f){const id=rid(f.org+' '+f.name);
    await store.set('events',id,{name:f.name,org:f.org,concept:true,dateLabel:f.dateLabel,timeLabel:f.timeLabel,venue:f.venue,blurb:f.blurb,
      codePrefix:(f.codePrefix||f.org.split(/\s+/).map(w=>w[0]).join('')).toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,4)||'EV',
      schedule:f.schedule,roles:[],interviewers:[]});return{ok:true,id}},
  async saveRole(role){const e=await store.get('events',EV);const roles=(e.roles||[]).slice();const i=roles.findIndex(r=>r.id===role.id);
    if(i>=0)roles[i]={...roles[i],...role};else roles.push({status:'open',...role,id:role.id||rid(role.title),createdAt:nowISO()});
    await store.update('events',EV,{roles});return{ok:true}},
  async deleteRole(id){if(S.candidates.some(c=>c.roleId===id))return{err:'Candidates have applied for this role, so it can be closed but not deleted.'};
    const e=await store.get('events',EV);await store.update('events',EV,{roles:(e.roles||[]).filter(r=>r.id!==id),interviewers:(e.interviewers||[]).map(i=>({...i,roleIds:i.roleIds.filter(x=>x!==id)}))});return{ok:true}},
  async saveInterviewer(iv){const e=await store.get('events',EV);const list=(e.interviewers||[]).slice();const i=list.findIndex(x=>x.id===iv.id);
    const isNew=i<0;const rec=isNew?{...iv,id:rid(iv.name)}:{...list[i],...iv};if(isNew)list.push(rec);else list[i]=rec;
    await store.update('events',EV,{interviewers:list});
    if(isNew){for(const t of slotTimes(schedOf(e)))await store.set('slots',slotId(EV,rec.id,t),{eventId:EV,interviewerId:rec.id,time:t,candidateId:null,status:'open'})}
    return{ok:true}},
  async removeInterviewer(id){const mine=S.slots.filter(s=>s.interviewerId===id);if(mine.some(s=>s.candidateId))return{err:'This interviewer has candidates booked. Unassign or finish those interviews first.'};
    for(const s of mine)await store.remove('slots',s.id);const e=await store.get('events',EV);await store.update('events',EV,{interviewers:(e.interviewers||[]).filter(i=>i.id!==id)});return{ok:true}},
  async applySchedule(sc){if(toMin(sc.end)-toMin(sc.start)<Number(sc.length))return{err:'The end time must be at least one interview length after the start.'};
    const times=new Set(slotTimes(sc)),e=event();let added=0,removed=0,kept=0;
    for(const iv of e.interviewers){for(const t of times){if(!S.slots.some(s=>s.interviewerId===iv.id&&s.time===t)){await store.set('slots',slotId(EV,iv.id,t),{eventId:EV,interviewerId:iv.id,time:t,candidateId:null,status:'open'});added++}}}
    for(const s of S.slots.filter(s=>!times.has(s.time))){if(s.candidateId)kept++;else{await store.remove('slots',s.id);removed++}}
    await store.update('events',EV,{schedule:{start:sc.start,end:sc.end,length:Number(sc.length)}});return{ok:true,added,removed,kept}},
  async saveConfig(c){const cur=await store.get('config','main');if(cur){const{id,...rest}=cur;await store.set('config','main',{...rest,...c})}else await store.set('config','main',c);return{ok:true}}
});

  ivForm(id){const e=event(),iv=id?ivOf(id):{name:'',title:'',room:'',roleIds:[]};this.editIv=id;
    $('#ivform').innerHTML=`<form class="qitem" id="ivf" novalidate style="margin-top:12px"><div class="fgrid">
      <div><label for="iv-name">Name</label><input id="iv-name" type="text" value="${esc(iv.name)}"></div>
      <div><label for="iv-title">Title</label><input id="iv-title" type="text" value="${esc(iv.title)}"></div>
      <div class="full"><label for="iv-room">Room or table</label><input id="iv-room" type="text" value="${esc(iv.room)}" placeholder="e.g. Room D"></div>
      <div class="full"><label>Interviews for</label><div class="scale">${e.roles.map(r=>`<input type="checkbox" id="ivr-${r.id}" value="${r.id}" ${iv.roleIds.includes(r.id)?'checked':''}><label for="ivr-${r.id}">${esc(r.title)}</label>`).join('')||'<span class="hint">Add a role first.</span>'}</div></div></div>
      <div class="row" style="margin-top:12px"><button class="btn sm" type="submit">${id?'Save':'Add to panel'}</button><button type="button" class="btn ghost sm" id="ivx">Cancel</button></div></form>`;
    $('#ivx').onclick=()=>{$('#ivform').innerHTML='';this.editIv=null};$('#iv-name').focus();
    $('#ivf').addEventListener('submit',async ev=>{ev.preventDefault();const v=x=>$('#'+x).value.trim();const roleIds=$$('#ivf input[type=checkbox]:checked').map(x=>x.value);
      if(!v('iv-name')||!roleIds.length)return toast('Add a name and at least one role.',true);
      await A.saveInterviewer({...(id?{id}:{}),name:v('iv-name'),title:v('iv-title')||'Interviewer',room:v('iv-room')||'TBD',roleIds});
      $('#ivform').innerHTML='';this.editIv=null;toast(id?'Interviewer updated.':'Interviewer added with a full slot schedule.')})},
  update(){if(!$('#rolelist'))return;const e=event();
    $('#slotcount')&&($('#slotcount').textContent=`${S.slots.length} slots · ${S.slots.filter(s=>s.candidateId).length} booked`);
    $('#rolelist').innerHTML=e.roles.length?e.roles.map(r=>{const n=S.candidates.filter(c=>c.roleId===r.id).length,pr=S.promos.find(p=>p.roleId===r.id);
      const ch=pr?Object.keys(pr.shared||{}).length+(pr.sentAt?' · auto-published':''):0;
      return `<div class="person"><div class="who"><b>${esc(r.title)} ${r.status==='closed'?'<span class="pill p-registered">Closed</span>':'<span class="pill p-completed">Open</span>'}</b>
      <small>${esc(r.team)}${r.type?' · '+esc(r.type):''}${r.pay?' · '+esc(r.pay):''} · ${n} applicant${n===1?'':'s'}${ch?` · shared on ${ch}`:''}</small></div>
      <div class="row" style="gap:6px"><button class="btn gold sm" data-act="promo" data-id="${r.id}">Promote</button><button class="btn ghost sm" data-act="erole" data-id="${r.id}">Edit</button>
      <button class="btn ghost sm" data-act="trole" data-id="${r.id}">${r.status==='closed'?'Reopen':'Close'}</button>${n?'':`<button class="btn danger sm" data-act="drole" data-id="${r.id}">Delete</button>`}</div></div>`}).join('')
      :'<div class="empty">No roles yet. Add the first one.</div>';
    $('#ivlist').innerHTML=e.interviewers.length?e.interviewers.map(i=>{const b=S.slots.filter(s=>s.interviewerId===i.id&&s.candidateId).length;
      return `<div class="person"><div class="avatar">${esc(initials(i.name))}</div><div class="who"><b>${esc(i.name)}</b><small>${esc(i.title)} · ${esc(i.room)} · ${esc(i.roleIds.map(x=>roleOf(x).title).join(', '))} · ${b} booked</small></div>
      <div class="row" style="gap:6px"><button class="btn ghost sm" data-act="eiv" data-id="${i.id}">Edit</button><button class="btn danger sm" data-act="div" data-id="${i.id}">Remove</button></div></div>`}).join('')
      :'<div class="empty">No interviewers yet.</div>'}
};

/* ================= Promote: AI posts, banner, one-click sharing ================= */
const CH=[['linkedin','LinkedIn'],['facebook','Facebook'],['instagram','Instagram'],['x','X'],['indeed','Indeed']];
const tag=s=>'#'+String(s||'').replace(/[^A-Za-z0-9]/g,'');
function templatePosts(e,r,link){const req=(r.requirements||[]).slice(0,3);const extra=[r.type,r.pay].filter(Boolean).join(' · ');
  return{
   linkedin:`We're hiring: ${r.title} at ${e.org}.\n\n${r.summary}${extra?`\n${extra}`:''}\n\nWhat we're looking for:\n${req.map(x=>'• '+x).join('\n')}\n\nMeet the team at our ${e.name} on ${e.dateLabel} (${e.timeLabel}) in ${e.venue}. Register to interview on the spot:\n${link}\n\n#hiring #jobs ${tag(r.team)} ${tag(e.venue.split(',')[0])}`,
   facebook:`📣 Now hiring: ${r.title}!\n\n${r.summary} Join us at our ${e.name} on ${e.dateLabel} in ${e.venue}, meet the team, and interview the same day.\n\nRegister here 👉 ${link}`,
   instagram:`We're hiring a ${r.title} ✨\n\n${r.summary}\n\n📅 ${e.dateLabel}\n📍 ${e.venue}\n\nInterview on the spot at our ${e.name}. Registration link in bio.\n\n#hiring #nowhiring #jobs ${tag(r.team)} ${tag(e.org)}`,
   x:`We're hiring a ${r.title} at ${e.org}! Interview on the spot at our ${e.name}, ${e.dateLabel}. Register: ${link} #hiring #jobs`.slice(0,280),
   indeed:`${r.title}\n${e.org} · ${e.venue}${extra?`\n${extra}`:''}\n\nAbout the role\n${r.summary}\n\nRequirements\n${(r.requirements||[]).map(x=>'- '+x).join('\n')}\n\nHow to apply\nRegister for our ${e.name} on ${e.dateLabel} (${e.timeLabel}) and interview on the spot: ${link}`}}
function shareUrl(ch,text,link){const t=encodeURIComponent(text);
  return{linkedin:`https://www.linkedin.com/feed/?shareActive=true&text=${t}`,facebook:`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(link)}`,x:`https://x.com/intent/post?text=${t}`}[ch]||null}

let promoRole=null,drawerMode=null;
const Promo={
  open(roleId){promoRole=roleId;drawerMode='promo';drawerId=null;const d=$('#drawer');d.classList.add('on');d.setAttribute('aria-hidden','false');$('#scrim').classList.add('on');
    const r=roleOf(roleId);
    d.innerHTML=`<div class="dh"><div style="flex:1;min-width:0"><span class="pill p-walk">Promote role</span><h2 style="margin:6px 0 0">${esc(r.title)}</h2><div class="muted">${esc(event().org)} · ${esc(event().name)}</div></div><button class="btn ghost sm" data-act="close">Close</button></div>
    <div class="db"><div class="panel"><div class="row"><h3 style="margin:0">Banner</h3><span class="spacer"></span><button class="btn ghost sm" id="pbdl">Download PNG</button></div>
      <canvas id="pban" width="1200" height="627" style="width:100%;height:auto;border-radius:8px;margin-top:10px" aria-label="Job banner preview"></canvas></div>
    <div class="panel"><div class="row"><h3 style="margin:0">Posts for every channel</h3><span class="spacer"></span><button class="btn gold sm" id="pgen">✦ Write with AI</button></div>
      <p class="hint" style="margin:6px 0 10px">Ready-to-post drafts are filled in automatically. AI rewrites them in each platform’s style. Edit anything before sharing.</p><div id="pposts"></div></div>
    <div class="panel"><h3>Publish to all channels</h3><p class="hint" style="margin:0 0 10px">Sends every post, the apply link, and role details to your connected automation, which posts to all accounts at once.</p>
      <div class="row"><button class="btn" id="pall">Publish to all channels</button><span class="hint" id="pstat"></span></div></div></div>`;
    $('#pgen').onclick=()=>this.ai();$('#pall').onclick=()=>this.publishAll();$('#pbdl').onclick=()=>this.download();
    this.renderPosts(true);(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>this.banner());this.banner();this.update()},
  posts(){const pr=S.promos.find(p=>p.roleId===promoRole);return pr?.posts||templatePosts(event(),roleOf(promoRole),applyLink())},
  renderPosts(){const p=this.posts();
    $('#pposts').innerHTML=CH.map(([k,l])=>`<div class="qitem" style="background:var(--panel)"><div class="row"><b>${l}</b><span class="hint" id="pc-${k}"></span><span class="spacer"></span><span id="ps-${k}"></span></div>
      <textarea id="pt-${k}" style="min-height:${k==='x'?70:120}px;margin-top:8px">${esc(p[k]||'')}</textarea>
      <div class="row" style="margin-top:8px">${shareUrl(k,'','')!==null?`<a class="btn sm" data-share="${k}" href="#" target="_blank" rel="noopener">Share on ${l}</a>`:''}<button class="btn ghost sm" data-copy="${k}">Copy${k==='instagram'?' caption':''}</button>${k==='instagram'?'<span class="hint">Post with the banner from the Instagram app.</span>':''}${k==='indeed'?'<span class="hint">Paste into Indeed’s job post form.</span>':''}</div></div>`).join('');
    CH.forEach(([k])=>{const ta=$('#pt-'+k),cnt=()=>{$('#pc-'+k).textContent=k==='x'?`${ta.value.length}/280`:''};ta.oninput=cnt;cnt()});
    $$('[data-share]').forEach(a=>a.onclick=()=>{const k=a.dataset.share,txt=$('#pt-'+k).value;a.href=shareUrl(k,txt,applyLink());
      if(k==='facebook')navigator.clipboard?.writeText(txt).catch(()=>{});this.mark(k);if(k==='facebook')toast('Post text copied. Paste it into Facebook.')});
    $$('[data-copy]').forEach(b=>b.onclick=async()=>{const k=b.dataset.copy;try{await navigator.clipboard.writeText($('#pt-'+k).value);toast('Copied.');this.mark(k)}catch(e){toast('Select the text and copy it.',true)}});
    this.update()},
  async save(patch){const id=`${EV}--${promoRole}`;const cur=await store.get('promos',id);
    if(cur)await store.update('promos',id,patch);else await store.set('promos',id,{eventId:EV,roleId:promoRole,posts:null,shared:{},sentAt:null,...patch})},
  async mark(k){const pr=S.promos.find(p=>p.roleId===promoRole);await this.save({shared:{...(pr?.shared||{}),[k]:nowISO()}})},
  update(){if(drawerMode!=='promo'||!$('#pposts'))return;const pr=S.promos.find(p=>p.roleId===promoRole);
    CH.forEach(([k])=>{const at=pr?.shared?.[k];const el=$('#ps-'+k);if(el)el.innerHTML=at?`<span class="pill p-completed">✓ Shared ${tFmt(at)}</span>`:''});
    $('#pstat')&&($('#pstat').textContent=pr?.sentAt?`Last published to all channels at ${tFmt(pr.sentAt)}.`:CONFIG.webhookUrl?'Automation connected.':'Connect an automation in Setup → Integrations.')},
  async ai(){if(!sample){toast('AI writing runs in the Claude-hosted version. The ready-made drafts work everywhere.',true);return}
    const e=event(),r=roleOf(promoRole),b=$('#pgen');b.disabled=true;b.innerHTML='<span class="spin"></span> Writing…';
    try{const out=await sample.json(`Write recruiting posts for a job opening. Use ONLY these facts; do not invent pay, benefits, or requirements.
Organization: ${e.org}
Event: ${e.name} on ${e.dateLabel}, ${e.timeLabel}, at ${e.venue}. Candidates register online and interview on the spot.
Role: ${r.title} (${r.team}${r.type?', '+r.type:''}${r.pay?', '+r.pay:''})
Summary: ${r.summary}
Requirements: ${(r.requirements||[]).join('; ')}
Apply link: ${applyLink()}
Return ONLY JSON: {"linkedin":"professional, 90-140 words, 3-4 bullet requirements, link, 3-4 hashtags","facebook":"friendly, 50-80 words, link, max 2 emoji","instagram":"energetic caption, 40-70 words, 'link in bio' instead of URL, 5-8 hashtags","x":"under 260 characters including link and 2 hashtags","indeed":"plain job post with headings: About the role, Requirements, How to apply"}`);
      const posts={};CH.forEach(([k])=>{posts[k]=String(out[k]||'')});if(!posts.linkedin)throw 0;posts.x=posts.x.slice(0,280);
      await this.save({posts,generatedAt:nowISO()});await sleep(150);this.renderPosts();toast('AI posts ready for every channel.')}
    catch(x){toast(x&&x.code==='not_granted'?'AI access was declined for this session.':'Couldn’t write posts. Try again.',true)}
    finally{b.disabled=false;b.innerHTML='✦ Rewrite with AI'}},
  async publishAll(){const url=CONFIG.webhookUrl,st=$('#pstat');if(!url){toast('Add your Make or Zapier webhook in Setup → Integrations first.',true);return}
    const e=event(),r=roleOf(promoRole),body=new URLSearchParams({event:`${e.org} ${e.name}`,event_date:e.dateLabel,location:e.venue,role:r.title,team:r.team,type:r.type||'',pay:r.pay||'',apply_link:applyLink()});
    CH.forEach(([k])=>body.append(`${k}_post`,$('#pt-'+k).value));
    const b=$('#pall');b.disabled=true;b.innerHTML='<span class="spin"></span> Publishing…';
    try{await fetch(url,{method:'POST',mode:'no-cors',body});await this.save({sentAt:nowISO()});toast('Sent to your automation. It’s posting to every connected channel.')}
    catch(x){toast('This view can’t reach outside services. Publish from the deployed version, or use the share buttons.',true)}
    finally{b.disabled=false;b.textContent='Publish to all channels'}},
  banner(){const c=$('#pban');if(!c)return;const x=c.getContext&&c.getContext('2d');if(!x)return;const _=0,W=1200,H=627,e=event(),r=roleOf(promoRole);
    x.fillStyle='#FBF8F2';x.fillRect(0,0,W,H);x.strokeStyle='rgba(201,151,58,.30)';x.lineWidth=2;x.beginPath();x.arc(1080,90,230,0,Math.PI*2);x.stroke();x.beginPath();x.arc(1080,90,160,0,Math.PI*2);x.stroke();
    x.fillStyle='#C9973A';x.fillRect(0,H-10,W,10);x.textBaseline='alphabetic';
    x.fillStyle='#7A5A16';x.font='700 24px Manrope, Arial, sans-serif';x.fillText(`WE'RE HIRING  ·  ${e.org.toUpperCase()}`.slice(0,60),70,110);
    x.fillStyle='#13294B';let fs=86;x.font=`500 ${fs}px Fraunces, Georgia, serif`;while(x.measureText(r.title).width>1040&&fs>48){fs-=4;x.font=`500 ${fs}px Fraunces, Georgia, serif`}
    x.fillText(r.title,70,230);
    x.fillStyle='#667085';x.font='500 30px Manrope, Arial, sans-serif';const words=(r.summary||'').split(' ');let line='',y=300;
    for(const w of words){const t=line?line+' '+w:w;if(x.measureText(t).width>900){x.fillText(line,70,y);y+=42;line=w}else line=t}if(line)x.fillText(line,70,y);
    x.fillStyle='#13294B';x.font='700 30px Manrope, Arial, sans-serif';x.fillText(`${e.name}  ·  ${e.dateLabel}`.slice(0,64),70,470);
    x.fillStyle='#667085';x.font='500 26px Manrope, Arial, sans-serif';x.fillText(`${e.venue}${r.pay?'  ·  '+r.pay:''}`,70,512);
    const cta='Register to interview  →';x.font='800 28px Manrope, Arial, sans-serif';const tw=x.measureText(cta).width;x.fillStyle='#13294B';
    x.beginPath();x.roundRect?x.roundRect(W-tw-130,440,tw+60,70,35):x.rect(W-tw-130,440,tw+60,70);x.fill();x.fillStyle='#FFFFFF';x.fillText(cta,W-tw-100,485)},
  download(){const c=$('#pban'),name=`${slug(roleOf(promoRole).title).replace(/[^a-z0-9]+/g,'-')}-banner.png`;
    c.toBlob(async b=>{if(downloads){try{const r=await downloads.save({filename:name,data:b});if(r.status==='saved')toast('Banner saved.')}catch(e){if(e&&e.code!=='declined')toast('Couldn’t save the banner here.',true)}}
      else{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();toast('Banner downloaded.')}},'image/png')}
};
document.addEventListener('click',async e=>{const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act,id=t.dataset.id;
  if(a==='promo')Promo.open(id);
  else if(a==='erole')V.setup.roleForm(id);
  else if(a==='trole'){const r=roleOf(id);await A.saveRole({id,status:r.status==='closed'?'open':'closed'});toast(r.status==='closed'?'Role reopened.':'Role closed. It no longer appears on the registration page.')}
  else if(a==='drole'){if(!confirm('Delete this role?'))return;const r=await A.deleteRole(id);r.ok?toast('Role deleted.'):toast(r.err,true)}
  else if(a==='eiv')V.setup.ivForm(id);
  else if(a==='div'){if(!confirm('Remove this interviewer and their open slots?'))return;const r=await A.removeInterviewer(id);r.ok?toast('Interviewer removed.'):toast(r.err,true)}
});

/* ================= Router & events ================= */
function show(v){view=v;pref('view',v);$$('.tab').forEach(t=>t.setAttribute('aria-selected',String(t.dataset.view===v)));V[v].mount();refresh();}
$('#tabs').addEventListener('click',e=>{const t=e.target.closest('.tab');if(t){show(t.dataset.view);window.scrollTo(0,0)}});
$('#scrim').onclick=()=>Drawer.close();
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(drawerId||drawerMode))Drawer.close()});
document.addEventListener('click',async e=>{const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act;
  if(a==='checkin'){t.disabled=true;await doCheckIn(t.dataset.id)}
  else if(a==='assign'){const sel=$$('[data-pick]').find(x=>x.dataset.pick===t.dataset.id);if(!sel)return;t.disabled=true;const r=await A.assign(sel.value,t.dataset.id);
    if(r.ok){toast(`${cand(t.dataset.id)?.name} booked at ${slotFmt(r.s.time)} with ${r.iv.name}.`);delete V.sched.pick[t.dataset.id]}else{toast(r.err,true);t.disabled=false}}
  else if(a==='unassign'){const r=await A.unassign(t.dataset.slot);r.ok?toast('Slot reopened. Candidate is back in the waiting room.'):toast(r.err,true)}
  else if(a==='pickslot'){V.iv.slotId=t.dataset.slot;V.iv.update()}
  else if(a==='start'){t.disabled=true;const r=await A.start(t.dataset.slot);r.ok?toast('Interview started.'):(toast(r.err,true),t.disabled=false)}
  else if(a==='brief'){aiBrief(t.dataset.id,t)}
  else if(a==='open'){Drawer.open(t.dataset.id)}
  else if(a==='close'){Drawer.close()}
  else if(a==='decide'){const r=await A.decide(t.dataset.id,t.dataset.d);r.ok?toast(`Marked ${DEC[t.dataset.d]}.`):toast(r.err,true)}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'){const r=e.target.closest&&e.target.closest('tr[data-act="open"]');if(r)Drawer.open(r.dataset.id)}});
$('#evsel').addEventListener('change',e=>{EV=e.target.value;pref('ev',EV);if(drawerId||drawerMode)Drawer.close();subscribeEvent();show(view)});

/* ================= Boot ================= */
let booted=false;
function startWith(st){store=st;setLive(st.mode);
  store.sub('config',null,list=>{CONFIG=list.find(x=>x.id==='main')||{};if(drawerMode==='promo')Promo.update()});
  store.sub('events',null,list=>{S.events=list.sort((a,b)=>a.id==='tsa-austin'?-1:1);
    if(!S.events.length){$('#main').innerHTML='<div class="panel empty">No hiring events have been set up yet.</div>';return}
    $('#evsel').innerHTML=S.events.map(e=>`<option value="${e.id}">${esc(e.org)} · ${esc(e.name)}${e.concept?' (concept)':''}</option>`).join('');
    if(!EV||!S.events.some(e=>e.id===EV)){EV=pref('ev');if(!S.events.some(e=>e.id===EV))EV=S.events[0].id}
    $('#evsel').value=EV;
    if(!booted){booted=true;subscribeEvent();show(pref('view')&&V[pref('view')]?pref('view'):'cmd')}});}
(async()=>{
  const use=window.claude&&window.claude.use?n=>window.claude.use(n).catch(()=>null):async()=>null;
  const timeout=new Promise(r=>setTimeout(()=>r(null),4000));
  const db=await Promise.race([use('db'),timeout]);
  if(db){let canWrite=true;try{const user=await Promise.race([use('user'),sleep(3000).then(()=>null)]);if(user&&(await user.can('data.write'))===false)canWrite=false}catch(e){}
    if(!canWrite)startWith(new LocalStore());
    else{try{await db.collection('events').limit(1).get();startWith(new DbStore(db))}catch(e){startWith(new LocalStore())}}}
  else startWith(new LocalStore());
  use('sample').then(s=>{sample=s});use('downloads').then(d=>{downloads=d});
})();
</script>
